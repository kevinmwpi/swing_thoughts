# The swing thought bank. The bot posts these top to bottom, one per day.
#
# Every post renders as:
#
#   Swing Thought #12: "<cue>"
#
#   For: <for>
#
#   <feel>
#
#   Try it: <drill>          (only if drill is set)
#
# Fields
#   id      unique slug, never reuse or rename once posted (the log uses it)
#   cue     the swing thought itself, short enough to remember on the tee
#   for     who it's for: the miss or fault it fixes. This is the most important
#           line. It lets a reader skip what isn't theirs and spot what is.
#   feel    what it should feel like, in plain words
#   drill   optional: one concrete range rep
#   phase   setup | takeaway | backswing | transition | downswing | impact |
#           finish | tempo | putting | short-game | course | mental | practice
#   source  where the idea comes from (not posted; for our own honesty)
#   status  approved = will be posted, draft = waiting for review, retired = never
#
# Rules: original wording only (no pasting other people's tips), no links
# (they cost 13x more per post and get less reach), and every post must fit
# in 280 characters. `python -m bot check` enforces the last two.
#
# "Lead" = the side closer to the target (left side for a right-hander).
# "Trail" = the other side.

- id: turn-your-back
  cue: Turn your back to the target.
  for: Short, armsy backswings and over-the-top slices.
  feel: At the top your back faces the target and the arms just ride along. Turn first. Lift never.
  drill: 5 slow turns with a club across your chest, then hit 10 balls.
  phase: backswing
  source: Common teaching cue
  status: approved

- id: grip-toothpaste
  cue: Hold it like a tube of toothpaste.
  for: Death grips that kill speed.
  feel: Firm enough to control it, light enough that nothing squirts out. Tight hands make tight arms, and tight arms are slow.
  drill: Rate your grip 1-10 at address. Hit 10 balls at a 4.
  phase: setup
  source: Common cue; Sam Snead's "hold it like a small bird" image
  status: approved

- id: hold-your-finish
  cue: Hold your finish for three seconds.
  for: Off-balance swings and hitting "at" the ball.
  feel: Belt buckle at the target, weight on your lead foot, trail toe up. Can't hold it? You swung out of balance.
  drill: Count to three in your finish on every range ball.
  phase: finish
  source: Common teaching cue
  status: approved

- id: start-it-through-the-gate
  cue: Start it through the gate.
  for: Short putts that start offline.
  feel: Most short misses never start on line. Make the start line your only job and trust your read.
  drill: Two tees 6 inches ahead of the ball, just wider than it. Roll 20 putts through.
  phase: putting
  source: Common putting gate drill
  status: approved

- id: swing-the-clubhead
  cue: Swing the clubhead, not the club.
  for: Tight, jerky swings.
  feel: Feel the weight of the head on the end of the shaft, like a rock on a string. Ernest Jones built a career on this.
  drill: Swing a knotted towel. Make it whoosh past the ball.
  phase: tempo
  source: Ernest Jones, "Swing the Clubhead" (1952)
  status: approved

- id: divot-after-ball
  cue: Make the divot after the ball.
  for: Fat and thin iron shots.
  feel: Your low point belongs in front of the ball. Look at its front edge, not the back, and get your weight forward by impact.
  drill: Lay a towel 4 inches behind the ball. Don't touch it.
  phase: impact
  source: Common low-point teaching
  status: approved

- id: see-the-shot
  cue: See the shot, then hit it.
  for: Thinking about mechanics over the ball.
  feel: From behind the ball, picture the flight. Start line, curve, landing spot. Then step in and let your body chase the picture. Jack Nicklaus called it "going to the movies."
  phase: mental
  source: Jack Nicklaus, "Golf My Way"
  status: approved

- id: bump-then-turn
  cue: Bump, then turn.
  for: Fat shots and slices from leading with the shoulders.
  feel: From the top, shift onto your lead foot first, then unwind. The club drops into the slot on its own.
  drill: Swing to the top, pump halfway down twice, then swing through.
  phase: transition
  source: Common transition cue
  status: approved

- id: hinge-from-hips
  cue: Hinge from the hips, not the waist.
  for: Hunched setups and inconsistent contact.
  feel: Push your hips back like you're closing a car door with them. Soft knees, flat back, arms hanging straight down from your shoulders.
  phase: setup
  source: Common posture teaching
  status: approved

- id: chip-like-you-putt
  cue: Chip like you putt.
  for: Chunked and bladed chips from too much wrist.
  feel: Narrow stance, weight forward, ball back. Rock your shoulders like a putting stroke and let the loft do the lifting.
  drill: Hit 10 chips with a 9-iron using only your putting stroke.
  phase: short-game
  source: Common chipping teaching
  status: approved

- id: feet-together
  cue: Swing with your feet together.
  for: Swaying, lunging, and swinging too hard.
  feel: Feet touching, easy 7-irons. Sway or overswing and you fall over, so arms and body learn to move together.
  drill: 10 balls feet together, then 5 normal with the same feel.
  phase: tempo
  source: Common balance drill
  status: approved

- id: swing-to-right-field
  cue: Swing out to right field.
  for: Righty slicers. Lefties, think left field.
  feel: Treat the target as second base and swing out to right field. In-to-out turns a slice into a draw.
  drill: Headcover 6 inches behind and just outside the ball. Miss it.
  phase: downswing
  source: Common path cue and headcover drill
  status: approved

- id: one-thought-per-round
  cue: One thought per round. That's it.
  for: Golfers who run through a checklist over every shot.
  feel: Pick one cue on the range, take it to the course, and leave everything else in the car. If it stops working, play by feel and fix it later.
  phase: mental
  source: Common coaching advice
  status: approved

- id: belly-button-takeaway
  cue: Take it back with your chest.
  for: Handsy takeaways that whip it inside.
  feel: Keep the arms-and-shoulders triangle for the first two feet. Chest turns, hands stay quiet.
  drill: Choke down with the grip in your belly button. Turn so the club moves with you.
  phase: takeaway
  source: Common one-piece takeaway drill
  status: approved

- id: seventeen-inches
  cue: Roll it 17 inches past.
  for: Three-putts and putts that die off line.
  feel: Dave Pelz found this speed holes the most putts. Firm enough to hold the line, soft enough to drop.
  drill: Tee 17 inches behind the hole. Stop 10 putts between the cup and the tee.
  phase: putting
  source: Dave Pelz, "Putting Bible"
  status: approved

- id: three-back-one-down
  cue: Three back, one down.
  for: Rushed transitions and quick, jerky swings.
  feel: John Novosel measured tour swings and found the backswing takes about three times as long as the downswing. Count one-two-three back, four through the ball.
  phase: tempo
  source: John Novosel, "Tour Tempo"
  status: approved

- id: skip-a-stone
  cue: Skip a stone with your trail hand.
  for: Over-the-top swings and early arm throw.
  feel: Trail elbow tucks in front of your hip, palm faces the target through impact. Pure sidearm.
  drill: 10 sidearm throws, then half wedges with the same feel.
  phase: downswing
  source: Common trail-arm image
  status: approved

- id: two-knuckles
  cue: See two knuckles on your lead hand.
  for: Slicers with a weak grip.
  feel: At address you should see two or three knuckles on your lead hand. Fewer than two and squaring the face gets hard.
  drill: Check it before every ball for a full bucket.
  phase: setup
  source: Common grip fundamental
  status: approved

- id: pane-of-glass
  cue: Stay under the pane of glass.
  for: Steep, upright backswings that come down over the top.
  feel: Ben Hogan pictured a sheet of glass resting on his shoulders, angled down to the ball. Swing back and through under it without shattering it.
  phase: backswing
  source: Ben Hogan, "Five Lessons" (1957)
  status: approved

- id: landing-spot
  cue: Pick a landing spot, not the hole.
  for: Inconsistent chips and pitches.
  feel: Choose the exact spot the ball should land and let it roll out. Eyes on the spot, swing to the spot.
  drill: Drop a towel on the green. Land 10 chips on it.
  phase: short-game
  source: Common short-game teaching
  status: approved

- id: think-outside-your-body
  cue: Think about the target, not your body.
  for: Golfers frozen by mechanical swing thoughts.
  feel: Research by Gabriele Wulf and others finds outside cues like "swing toward the flag" usually beat inside ones like "rotate your hips." Pick one outside image.
  phase: mental
  source: Wulf et al., attentional focus research
  status: approved

- id: butt-on-the-wall
  cue: Keep your backside on the wall.
  for: Early extension, thin shots, and blocks.
  feel: Picture your backside touching a wall at address. Keep it there through impact instead of thrusting your hips at the ball.
  phase: impact
  source: Common early-extension drill
  status: approved

- id: whoosh-after-ball
  cue: Make the whoosh after the ball.
  for: Casting that wastes your speed.
  feel: Hold a club by the head and swing it. The loudest whoosh should come after where the ball would be, not before.
  drill: 5 upside-down swings, then hit balls chasing that sound.
  phase: downswing
  source: Common speed drill
  status: approved

- id: waiter-tray
  cue: Trail elbow points at the ground.
  for: Flying elbows and loopy downswings.
  feel: At the top, the trail elbow points roughly down, like a waiter carrying a tray. That sets the club on plane.
  drill: Hold the tray pose in a mirror, then swing.
  phase: backswing
  source: Common teaching image
  status: approved

- id: splash-the-sand
  cue: Splash the sand, not the ball.
  for: Getting stuck in greenside bunkers.
  feel: Open the face, enter two inches behind the ball, and throw sand onto the green. The ball rides out on it.
  drill: Draw a line in the sand. Splash it 10 times, no ball.
  phase: short-game
  source: Common bunker teaching
  status: approved

- id: swing-at-eighty
  cue: Swing at 80 percent.
  for: Players who lose control trying to kill it.
  feel: An 80 percent swing finds the center of the face more often, and center contact beats raw speed for distance.
  drill: Hit 10 at what feels like 80. Check how far they went.
  phase: tempo
  source: Common advice; smash factor / centered contact
  status: approved

- id: trail-back-pocket
  cue: Turn into your trail back pocket.
  for: Swaying and reverse pivots.
  feel: Your trail pocket moves back behind you, not sideways. Weight stays on the inside of your trail foot.
  drill: Trail hip an inch from your bag. Turn back without bumping it.
  phase: backswing
  source: Common pivot cue
  status: approved

- id: clip-the-tee
  cue: Just clip the tee.
  for: Great practice swings that vanish over the ball.
  feel: Harvey Penick had students clip a tee with a practice swing, then repeat it with a ball teed up. The ball just gets in the way.
  drill: Three swings clipping a tee, then hit one.
  phase: impact
  source: Harvey Penick, "Little Red Book"
  status: approved

- id: same-routine
  cue: Same routine, every shot.
  for: Range heroes who fall apart on the course.
  feel: Target, one rehearsal swing, step in, look twice, go. Same steps every time gives your nerves something familiar.
  drill: Hit your last 10 range balls with the full routine.
  phase: mental
  source: Common performance psychology advice
  status: approved

- id: sweep-the-driver
  cue: Sweep the driver off the tee.
  for: Skied drives and big slices with the driver.
  feel: Ball off your lead heel, teed so half the ball sits above the crown. Tilt your spine slightly away from the target and catch it on the way up.
  phase: setup
  source: Common driver setup teaching
  status: approved

- id: pull-the-bell-rope
  cue: Pull the bell rope.
  for: Casting and weak, high shots.
  feel: From the top, pull your hands straight down like ringing a church bell. The club stays back and releases late.
  drill: Slow swings, stop with hands at your trail thigh. Shaft should still point up.
  phase: transition
  source: Common lag cue
  status: approved

- id: towel-under-arms
  cue: Keep the towel under your arms.
  for: Arms and body working separately.
  feel: Tuck a towel under both armpits and make half swings without dropping it. Arms and chest move as one.
  drill: 10 half swings with it, then 5 full swings with the same feel.
  phase: backswing
  source: Common connection drill
  status: approved

- id: listen-for-it
  cue: Listen for it. Don't look for it.
  for: Pulling and peeking on short putts.
  feel: Inside 6 feet, keep your head still and listen for the ball to drop. Looking early pulls your shoulders open.
  drill: 10 three-footers, eyes on the spot where the ball was.
  phase: putting
  source: Common putting advice
  status: approved

- id: aim-face-first
  cue: Aim the clubface first, then your feet.
  for: Good swings that still miss the target.
  feel: Pick a spot a foot ahead of the ball on your line. Aim the face at the spot, then build your stance around it.
  drill: Lay a club on your toe line when you practice.
  phase: setup
  source: Jack Nicklaus's intermediate target
  status: approved

- id: chest-to-target
  cue: Chest to the target at the finish.
  for: Flips and blocks from the body stalling.
  feel: Keep turning through impact until your chest faces the target. When the body keeps moving, the hands stop flipping to save the shot.
  phase: finish
  source: Common rotation cue
  status: approved

- id: lead-heel-up
  cue: Let your lead heel come up.
  for: Stiff players who can't make a full turn.
  feel: Jack Nicklaus did it his whole career. Let the lead heel lift an inch going back to free your hips, then replant it to start down.
  drill: 10 balls feeling heel up, heel down.
  phase: backswing
  source: Jack Nicklaus's swing
  status: approved

- id: pitch-with-your-chest
  cue: Turn your chest to pitch. Don't flick.
  for: Bladed and chunked pitches.
  feel: Wrists stay quiet and the chest turn carries the club through. The body controls distance, not the hands.
  drill: Pitch 10 with a glove under your lead armpit. Keep it there.
  phase: short-game
  source: Common pitching teaching
  status: approved

- id: exhale
  cue: Exhale before you pull the trigger.
  for: Tension and first-tee nerves.
  feel: Slow breath in behind the ball, full exhale over it. A long exhale drops your shoulders and lowers your grip pressure.
  phase: mental
  source: Common breathing technique
  status: approved

- id: inside-quarter
  cue: Hit the inside quarter of the ball.
  for: Slices and pulls from an outside-in path.
  feel: Stare at the back inside quarter of the ball, behind it and toward your feet. Strike it there and the club has to come from the inside.
  phase: impact
  source: Common path cue
  status: approved

- id: wide-not-long
  cue: Make your arc wide, not long.
  for: Overswinging and collapsing arms at the top.
  feel: Push your hands away from your chest going back. A wide three-quarter swing beats a long, collapsed one.
  drill: Hit 10 balls stopping at lead arm parallel.
  phase: backswing
  source: Common width teaching
  status: approved

- id: hands-ahead
  cue: Lead the clubhead with your hands.
  for: Flips, thins, and ballooning irons.
  feel: At impact your hands are over your lead thigh, ahead of the ball. The shaft leans forward and pinches the ball.
  drill: 10 knee-high to knee-high shots, hands ahead at impact.
  phase: impact
  source: Common impact fundamental
  status: approved

- id: turn-in-a-barrel
  cue: Turn inside a barrel.
  for: Swaying and sliding off the ball.
  feel: Picture standing in a barrel just wider than your hips. Turn back and through without your hips touching the sides.
  phase: backswing
  source: Classic teaching image
  status: approved

- id: breezy-easy
  cue: When it's breezy, swing easy.
  for: Shots that balloon into the wind.
  feel: Take one or two more clubs and make a smoother swing. Swinging harder adds spin, and spin is what the wind grabs.
  phase: course
  source: Old golf saying; spin physics
  status: approved

- id: hold-off-the-finish
  cue: Hold off the finish.
  for: Hooks and snap hooks.
  feel: Feel the clubface point at the sky a little longer after impact, lead wrist firm. Less rolling of the hands.
  drill: 10 balls with a short, held-off finish. Watch the curve shrink.
  phase: finish
  source: Common hook fix
  status: approved

- id: l-to-l
  cue: Swing L to L.
  for: Anyone who wants a compact, repeatable swing.
  feel: Back until your lead arm and shaft make an L. Through until your trail arm and shaft make an L. Good contact lives here.
  drill: 20 balls L to L with an 8-iron before any full swings.
  phase: practice
  source: Common drill
  status: approved

- id: sweep-the-fairway-wood
  cue: Sweep it like a broom.
  for: Topped and fat fairway woods.
  feel: Ball just forward of center, brush the grass through the ball like a broom. The loft lifts it. Trying to help it up is what tops it.
  phase: impact
  source: Common fairway wood teaching
  status: approved

- id: hum-it
  cue: Hum while you swing.
  for: Tension and rushed tempo under pressure.
  feel: Hum one steady note from takeaway to finish. It's hard to strangle the club while humming, and the rhythm carries into the swing.
  phase: tempo
  source: Common tension-release cue
  status: approved

- id: shoulder-under-chin
  cue: Lead shoulder turns under your chin.
  for: Flat, level shoulder turns that lift you out of posture.
  feel: Your shoulders turn at a right angle to your spine. On the backswing the lead shoulder works down and under your chin, not level around.
  phase: backswing
  source: Common shoulder-plane teaching
  status: approved

- id: rock-the-shoulders
  cue: Rock the shoulders. Quiet the wrists.
  for: Wristy putting strokes and inconsistent distance.
  feel: Your shoulders rock like a seesaw. Arms and putter go along for the ride, hands just hold on.
  drill: 10 putts with an alignment stick under both armpits.
  phase: putting
  source: Common putting fundamental
  status: approved

- id: back-to-target-longer
  cue: Start down with your back to the target.
  for: Shoulders that open early and pull or slice.
  feel: Let the lower body start down while your back keeps facing the target for a split second longer. The arms drop in behind you.
  phase: transition
  source: Common sequencing cue
  status: approved

- id: change-targets
  cue: Never hit the same shot twice in a row.
  for: Range rats whose practice doesn't show up on the course.
  feel: Change club or target every ball. It feels worse on the range, but research on varied practice shows it holds up better on the course.
  phase: practice
  source: Contextual interference / random practice research
  status: approved

- id: keep-trail-knee-flex
  cue: Keep some flex in your trail knee.
  for: Losing posture and spinning your hips on the backswing.
  feel: Turn back against your trail knee. If it locks straight, your hips over-rotate and the coil you built leaks out.
  phase: backswing
  source: Common pivot teaching
  status: approved

- id: hit-down-to-go-up
  cue: Hit down to make it go up.
  for: Players who scoop irons trying to lift the ball.
  feel: The loft on the club gets the ball in the air. Hit down and through the ball and it climbs. Scoop up at it and it skulls.
  phase: impact
  source: Common impact fundamental
  status: approved

- id: wedge-clock
  cue: Use a clock for wedge distances.
  for: Players who guess on partial wedges.
  feel: Swing your lead arm back to 8, 9, and 10 o'clock, same tempo each time. Three swings per wedge is a yardage chart.
  drill: Hit 5 at each and write down the carry.
  phase: short-game
  source: Dave Pelz's clock system
  status: approved

- id: pause-at-the-top
  cue: Finish the backswing before you start down.
  for: Quick transitions and hitting from the top.
  feel: Feel a tiny pause at the top, like the club hangs there for a beat. Hideki Matsuyama pauses visibly. You don't have to go that far.
  phase: tempo
  source: Common tempo cue; Matsuyama's pause
  status: approved

- id: lead-hip-back
  cue: Lead hip goes back, not forward.
  for: Hips that slide toward the target and get stuck.
  feel: Starting down, feel your lead hip pocket rotate behind you. Rotation, not a slide, is what clears room for your arms.
  phase: downswing
  source: Common rotation cue
  status: approved

- id: match-the-slope
  cue: Set your shoulders to the slope.
  for: Fat and thin shots from uneven lies.
  feel: Tilt your shoulders to match the ground so the club can swing along it. Uphill lies fly higher and pull. Downhill lies fly lower and push.
  phase: course
  source: Common uneven-lie teaching
  status: approved

- id: elbow-to-hip
  cue: Trail elbow to trail hip.
  for: Steep swings, pulls, and deep divots.
  feel: Start down by dropping your trail elbow toward your trail hip. The club shallows and comes from the inside.
  drill: Slow-motion swings dropping the elbow to your side first.
  phase: transition
  source: Common shallowing cue
  status: approved

- id: set-by-parallel
  cue: Club points up by lead arm parallel.
  for: Late, rushed wrist sets.
  feel: At lead arm parallel, the shaft points roughly at the sky. Set early, then just turn. It takes timing out of the top.
  drill: Check it in a mirror 10 times, then hit balls.
  phase: backswing
  source: Common wrist-hinge teaching
  status: approved

- id: ten-steps
  cue: You get ten steps to be mad.
  for: Golfers who let one bad hole turn into five.
  feel: After a bad shot, take ten steps to be angry. Then it's over. The next shot doesn't know about the last one.
  phase: mental
  source: Common performance psychology advice
  status: approved

# --- Winter batch: posts #61-120, about Dec 14 to Feb 11. Added Nov 20, 2026. ---
# Leans toward drills you can do at home, indoors, or on a simulator.

- id: film-yourself
  cue: Film your swing before you fix it.
  for: Fixing a fault you've never actually seen.
  feel: What you feel and what you do are rarely the same. A phone at hand height, aimed down the target line, settles it.
  drill: Film 5 swings down the line and 5 face-on.
  phase: practice
  source: Common coaching practice
  status: approved

- id: coin-target
  cue: Putt to a coin, not a cup.
  for: Short putts that drift off line.
  feel: Aim small, miss small. Roll putts at a quarter on the carpet all winter and the real hole will look huge in spring.
  drill: 20 putts from 6 feet at a coin. Count how many touch it.
  phase: putting
  source: Common aim-small putting drill
  status: approved

- id: fingers-not-palm
  cue: Hold it in your fingers, not your palm.
  for: Weak slices and stiff wrists.
  feel: The grip runs across the base of your lead fingers. Palm grips lock the wrists and leave the face open.
  drill: Hold it with just your lead index finger and heel pad.
  phase: setup
  source: Common grip fundamental
  status: approved

- id: slow-motion
  cue: Swing at 20 percent speed.
  for: Swing changes that never make it to the course.
  feel: Your body learns a new move faster in slow motion. If you can't do it slowly, you can't do it fast.
  drill: 10 slow swings a night, no ball. Check the ceiling first.
  phase: practice
  source: Common motor learning practice
  status: approved

- id: cold-air-club-up
  cue: Cold day? Take one more club.
  for: Winter rounds where every iron comes up short.
  feel: Cold air is denser and a cold ball is less lively, so both cost carry. Below about 50 degrees, plan on one extra club and a smooth swing.
  phase: course
  source: Air density and ball temperature effects
  status: approved

- id: toe-up-at-hip
  cue: Toe up at hip height.
  for: Takeaways that roll the face open or shut it down.
  feel: When the shaft is parallel to the ground going back, the toe points roughly at the sky and the shaft runs along your toe line.
  drill: Stop there in a mirror 10 times.
  phase: takeaway
  source: Common takeaway checkpoint
  status: approved

- id: center-of-the-putter
  cue: Hit the middle of the putter.
  for: Putts that come up short or wobble.
  feel: Off-center hits lose speed and twist the face. Lots of misread putts were really mishit.
  drill: Put two rubber bands on the putter face, just wider than a ball. Roll 20 between them.
  phase: putting
  source: Common putting contact drill
  status: approved

- id: think-box-play-box
  cue: Think box, play box.
  for: Golfers still deciding while they swing.
  feel: Do all your thinking behind the ball. Once you step over the line into the play box, the only job left is to swing. Vision54 coaches teach it.
  phase: mental
  source: Pia Nilsson and Lynn Marriott, Vision54
  status: approved

- id: flat-lead-wrist
  cue: Flat lead wrist at the top.
  for: Slices from a face that's open at the top.
  feel: At the top, the back of your lead hand lines up with your forearm. A cupped wrist opens the face before you start down.
  drill: Hold the top in a mirror and check the wrist.
  phase: backswing
  source: Common clubface teaching
  status: approved

- id: let-the-bounce-brush
  cue: Let the bounce brush the ground.
  for: Chips that dig.
  feel: A wedge's back edge is built to glide. Don't lean the shaft way forward. Let the sole brush through.
  drill: Chip foam balls off a mat. Listen for a brush, not a thud.
  phase: short-game
  source: Common bounce-first chipping teaching
  status: approved

- id: speed-sets
  cue: Train speed over the winter.
  for: Wanting more distance by spring.
  feel: Speed is trained like strength. A few sets of all-out swings a few days a week add speed over a winter. Warm up first.
  drill: 3 sets of 5 max swings with a driver held upside down.
  phase: practice
  source: Overspeed training protocols
  status: approved

- id: trail-palm-matches-face
  cue: Trail palm matches the clubface.
  for: Hooks from a trail hand turned too far under.
  feel: At address your trail palm faces the target, same as the clubface. The lifeline of that hand sits on top of your lead thumb.
  drill: Set your grip in a mirror 10 times.
  phase: setup
  source: Common grip fundamental
  status: approved

- id: hallway-ladder
  cue: Stop each one just past the last.
  for: Lag putts that come up short or race by.
  feel: Distance is a feel you train, not a mechanic. Each ball should stop a little past the one before it.
  drill: Roll 5 balls down a hallway, each just past the last.
  phase: putting
  source: Common ladder drill
  status: approved

- id: trail-knee-to-lead-knee
  cue: Trail knee to lead knee.
  for: Hanging back on your trail side through impact.
  feel: Through the ball, your trail knee moves toward the target until it nearly touches your lead knee.
  drill: Hold every finish with your knees close together.
  phase: downswing
  source: Common weight-shift cue
  status: approved

- id: know-your-miss
  cue: Know your miss, then plan for it.
  for: Aiming at the flag no matter what.
  feel: Plan around your miss instead of trying to erase it. If you miss right, aim so a ball going right still finds grass.
  drill: Recall your last 5 rounds. Where did the misses go?
  phase: course
  source: Common course management advice
  status: approved

- id: upper-back-turn
  cue: Turn from your upper back.
  for: Turning by swaying or lifting the arms.
  feel: Real rotation comes from your mid back. Your hips can stay fairly quiet while your chest turns.
  drill: Sit on a chair, club across your chest. Turn 10 times, hips still.
  phase: backswing
  source: Common seated rotation drill
  status: approved

- id: pencil-in-the-watchband
  cue: Flat lead wrist through the chip.
  for: Flipped, scooped chips.
  feel: The lead wrist stays flat while the chest turns. Flipping it to help the ball up thins it.
  drill: A pencil under your watch band pokes you if you flip.
  phase: short-game
  source: Common chipping drill
  status: approved

- id: grip-while-watching-tv
  cue: Build your grip without looking.
  for: Grips that change from round to round.
  feel: A grip feels right when it's familiar. Twenty reps a night and by spring the right grip feels normal.
  drill: 20 grips during a TV show. Check one in a mirror.
  phase: practice
  source: Common off-season practice
  status: approved

- id: eyes-over-the-ball
  cue: Eyes over the ball, or just inside it.
  for: Good strokes that start offline.
  feel: Eyes outside the ball distort the line. Set them over it or a touch inside.
  drill: Drop a ball from your nose at address. It should land on or just inside yours.
  phase: putting
  source: Common putting setup check
  status: approved

- id: let-your-head-turn
  cue: Let your head turn with the follow-through.
  for: Stiff necks and blocked finishes.
  feel: Watch the ball into impact, then let your head rotate up with your chest. Annika Sorenstam's head turned toward the target before the ball was gone.
  phase: finish
  source: Annika Sorenstam's swing
  status: approved

- id: railroad-tracks
  cue: Stand on railroad tracks.
  for: Lining your body up at the flag.
  feel: The ball sits on the outside rail, aimed at the target. Your feet, hips, and shoulders sit on the inside rail, parallel to it.
  drill: Lay two clubs down as tracks when you practice.
  phase: setup
  source: Classic alignment image
  status: approved

- id: putt-to-a-beat
  cue: Putt to a beat.
  for: Jabby, inconsistent putting strokes.
  feel: Good putters keep the same rhythm on every putt and let the length of the stroke set the distance.
  drill: Set a metronome to about 75 beats per minute. Back on one, through on the next.
  phase: putting
  source: Common putting tempo drill
  status: approved

- id: chase-one-number
  cue: On the simulator, chase one number.
  for: Simulator golfers buried in data.
  feel: Pick the one number tied to your miss. Face-to-path for a slice, attack angle for a short driver, smash factor for strike. Ignore the rest.
  phase: practice
  source: Common launch monitor coaching
  status: approved

- id: toe-passes-heel
  cue: Let the toe pass the heel.
  for: Slices from a face that never closes.
  feel: Through impact your forearms rotate and the toe turns over the heel, like a tilted baseball swing.
  drill: Half swings with hands split 3 inches apart. Feel the forearms cross.
  phase: downswing
  source: Common split-hand release drill
  status: approved

- id: open-then-grip
  cue: Open the face, then take your grip.
  for: Bunker and lob shots that come out low.
  feel: Turn the club open first, then grip it. Grip first and twist the face open, and it twists back shut at impact.
  phase: short-game
  source: Common short-game fundamental
  status: approved

- id: one-number-by-spring
  cue: Pick one number to fix by spring.
  for: Off-season practice with no direction.
  feel: Choose one stat, like putts per round, fairways hit, or up-and-downs. Practice only what moves it, then check it again in April.
  phase: mental
  source: Common practice planning advice
  status: approved

- id: up-not-around
  cue: Take it back up, not around.
  for: Takeaways that whip it behind you.
  feel: Early on, the club works up as your chest turns and stays in front of you, not behind your back.
  drill: Backside a foot from a wall, slow backswings without the club touching it.
  phase: takeaway
  source: Common wall drill
  status: approved

- id: hold-the-putting-finish
  cue: Hold your putting finish.
  for: Putts that die because you slowed down.
  feel: Freeze the putter where the stroke ends. The follow-through should be at least as long as the backstroke.
  drill: 10 putts, holding each finish until the ball stops.
  phase: putting
  source: Common putting drill
  status: approved

- id: hips-that-turn
  cue: Your turn needs hips that turn.
  for: Short backswings from tight hips.
  feel: You can't turn what won't move. A couple of minutes of hip mobility a day adds real turn by spring. Never push into pain.
  drill: 10 hip switches a day from a 90/90 sit.
  phase: practice
  source: Common golf mobility drill
  status: approved

- id: freeze-impact
  cue: Freeze your impact.
  for: Flipping and weak contact.
  feel: At impact your hands lead, the lead wrist is flat, and your hips are open. Feeling it slowly teaches your body where it is.
  drill: Slow half swings into a duffel stuffed with towels. Hold impact.
  phase: impact
  source: Common impact bag drill
  status: approved

- id: putt-chip-pitch
  cue: Putt if you can. Chip if you can't.
  for: Golfers who grab a lob wedge around every green.
  feel: The lower the shot, the more predictable it is. Pitch only when you must carry something. It's an old saying because it works.
  phase: short-game
  source: Traditional short-game saying
  status: approved

- id: short-lead-thumb
  cue: Keep your lead thumb short.
  for: Overswinging and losing the club at the top.
  feel: Pull your lead thumb up the grip a little instead of stretching it down. A short thumb supports the club at the top so it doesn't collapse.
  phase: setup
  source: Ben Hogan, "Five Lessons"
  status: approved

- id: grade-the-process
  cue: Grade the process, not the result.
  for: Golfers whose mood follows the scorecard.
  feel: After each shot, ask one question. Did I commit to it? A committed swing that takes a bad bounce is still a good shot.
  phase: mental
  source: Common performance psychology advice
  status: approved

- id: shaft-at-the-target
  cue: Shaft parallel to the line at the top.
  for: Shots that start offline even with good aim.
  feel: At the top of a full swing, the shaft points about at the target. Laid off or across the line changes your path.
  drill: Check it at the top in a mirror.
  phase: backswing
  source: Common top-of-swing checkpoint
  status: approved

- id: lead-hand-putts
  cue: Putt with your lead hand only.
  for: Wristy strokes that flip at impact.
  feel: Your lead hand guides the stroke and keeps the face square. One-handed, you'll feel any flip right away.
  drill: 20 lead-hand-only putts from 4 feet on the carpet.
  phase: putting
  source: Common one-hand putting drill
  status: approved

- id: mats-hide-fat-shots
  cue: Mats hide your fat shots.
  for: Simulator golfers who strike it worse outdoors.
  feel: On a mat the club bounces into the ball, so fat shots can still fly fine. Check your strike.
  drill: Lay a tee flat 2 inches behind the ball. Hit it, and that shot was fat.
  phase: practice
  source: Common indoor practice advice
  status: approved

- id: post-up
  cue: Post up on your lead leg.
  for: Players who slide their hips and lose power.
  feel: Through impact your lead leg firms up and straightens. It works like a brake that whips your hips open and the club through.
  phase: downswing
  source: Common ground-force teaching
  status: approved

- id: one-more-club
  cue: Take one more club.
  for: Approach shots that keep landing short.
  feel: Amateurs miss short of the hole far more often than long. One more club and a smooth swing finds the middle of the green.
  phase: course
  source: Common course management advice; amateur shot data
  status: approved

- id: forward-press
  cue: Start with a forward press.
  for: Jerky takeaways from a dead stop.
  feel: A small press of the hands or trail knee toward the target, then the swing rebounds back. Moving into motion beats starting frozen.
  phase: tempo
  source: Common swing-start cue
  status: approved

- id: change-the-club
  cue: Change the club, not the swing.
  for: Golfers who invent a new chip every time.
  feel: Keep one chipping motion and pick the club by how much roll you want. Wedge for less roll, 8-iron for more.
  drill: Chip to one spot with three clubs and watch the roll.
  phase: short-game
  source: Common chipping system
  status: approved

- id: balanced-over-the-feet
  cue: Balance over the middle of your feet.
  for: Tipping toward the ball or back on your heels.
  feel: Weight over the middle of your feet, a touch toward the balls. Ready to jump straight up.
  drill: Rock onto your toes, then heels, then settle in between.
  phase: setup
  source: Common posture fundamental
  status: approved

- id: look-at-the-hole
  cue: Look at the hole on long putts.
  for: Lag putts with bad distance control.
  feel: Your eyes feed distance to your hands. Try watching the hole instead of the ball while you stroke.
  drill: 10 carpet putts to a doorway, eyes up.
  phase: putting
  source: Common lag putting drill
  status: approved

- id: know-your-strike
  cue: Know where you hit it on the face.
  for: Driver distance that comes and goes.
  feel: Center contact is worth more yards than extra speed. Toe and heel hits also curve like swing faults.
  drill: Spray foot powder on the face and read each mark.
  phase: impact
  source: Common strike-location drill
  status: approved

- id: tee-on-the-trouble-side
  cue: Tee it up on the trouble side.
  for: Tee shots that drift into the hazard you fear.
  feel: If trouble is right, tee up on the right side of the box and aim away from it. You open up more of the fairway.
  phase: course
  source: Common course management advice
  status: approved

- id: straight-not-stiff
  cue: Lead arm straight, not stiff.
  for: Rigid swings that kill speed.
  feel: Keep the lead arm extended but relaxed. A soft elbow at the top is fine. Locking it puts tension all the way up into your shoulders.
  phase: backswing
  source: Common teaching correction
  status: approved

- id: hybrid-like-an-iron
  cue: Hit your hybrid like an iron.
  for: Topped hybrids from trying to sweep them.
  feel: Ball a little forward of center, and hit slightly down like a long iron. The wide sole keeps it from digging.
  phase: impact
  source: Common hybrid teaching
  status: approved

- id: end-with-pressure
  cue: End practice with pressure.
  for: Short putts that fall apart when they count.
  feel: Finish every session with a test you can fail. Pressure in practice makes pressure on the course feel familiar.
  drill: Make 10 three-footers in a row. Miss one, start over.
  phase: practice
  source: Common pressure practice
  status: approved

- id: bunker-finish-length
  cue: Longer finish, longer bunker shot.
  for: Bunker shots with no distance control.
  feel: Keep the same splash spot every time. Change the distance with the length of your follow-through.
  drill: Hit three each with a short, half, and full finish.
  phase: short-game
  source: Common bunker distance teaching
  status: approved

- id: trail-shoulder-lower
  cue: Trail shoulder sits lower at address.
  for: Over-the-top swings that start from level shoulders.
  feel: Your trail hand is lower on the grip, so your trail shoulder should sit a little lower too. Level shoulders point your upper body across the line.
  phase: setup
  source: Common setup fundamental
  status: approved

- id: read-from-below
  cue: Read the putt from below the hole.
  for: Misreading break.
  feel: Break is easiest to see from the low side, where the slope tilts toward you. Take a look from there before you commit.
  drill: Next round, look from the low side on putts over 10 feet.
  phase: putting
  source: Common green-reading advice
  status: approved

- id: roll-the-trail-ankle
  cue: Roll the trail ankle.
  for: Spinning out and a trail heel that flies up early.
  feel: Through impact, roll onto the inside of your trail foot instead of popping the heel straight up. It keeps you in posture longer.
  phase: downswing
  source: Common footwork teaching
  status: approved

- id: middle-of-the-green
  cue: Aim at the middle of the green.
  for: Short-siding yourself chasing flags.
  feel: The center gives you room to miss in every direction. Go at the flag only with a short iron and room to miss.
  phase: course
  source: Common course management advice
  status: approved

- id: waggle-then-go
  cue: Waggle, then go.
  for: Freezing over the ball.
  feel: A small waggle keeps your hands soft. Standing still over the ball for more than a few seconds lets tension creep in.
  drill: Waggle twice, look once, swing. Same every time.
  phase: tempo
  source: Common pre-swing routine
  status: approved

- id: fairway-bunker
  cue: Ball first from a fairway bunker.
  for: Fat shots from fairway bunkers.
  feel: Grip down an inch, ball a touch back, lower body quiet. Take one more club and catch the ball before the sand.
  phase: course
  source: Common fairway bunker teaching
  status: approved

- id: ball-position
  cue: Check your ball position.
  for: Contact that comes and goes.
  feel: Center for wedges, a ball or two forward for mid irons, inside the lead heel for driver. It drifts without you noticing.
  drill: Lay a club from your feet to the ball to check it.
  phase: setup
  source: Common setup fundamental
  status: approved

- id: steeper-from-the-rough
  cue: Steeper from the rough.
  for: Shots that twist and grab out of thick grass.
  feel: Ball back a little, firmer grip, steeper swing, so less grass gets between club and ball. Expect less spin and more roll.
  phase: course
  source: Common rough teaching
  status: approved

- id: hybrid-chip
  cue: Chip with a hybrid from the fringe.
  for: Chunked chips from tight lies.
  feel: Grip down, stand close, and use your putting stroke. The wide sole won't dig, and the ball rolls out like a putt.
  phase: short-game
  source: Common short-game option
  status: approved

- id: safest-club-first-tee
  cue: Hit your safest club off the first tee.
  for: Rounds that start with a double bogey.
  feel: Nerves peak on the first tee. Pick the club you hit straightest, not the longest one, and get the round started.
  phase: course
  source: Common course management advice
  status: approved

- id: use-the-line
  cue: Use the line on your ball.
  for: Putts where you never feel aimed.
  feel: From behind, line up the logo or a drawn line with your start line. Then square the putter to it. Some players aim worse with it, so test it.
  phase: putting
  source: Common putting alignment aid
  status: approved

- id: favorite-layup
  cue: Lay up to your favorite number.
  for: Golfers who hit 3-wood on every second shot.
  feel: Know your favorite full wedge distance. On a par 5 you can't reach, lay up to that number instead of as close as possible.
  phase: course
  source: Common course management advice
  status: approved
